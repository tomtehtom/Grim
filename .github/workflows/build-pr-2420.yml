name: Build Grim with PR 2420

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Grim
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download PR 2420 diff
        run: |
          curl -L https://patch-diff.githubusercontent.com/raw/GrimAnticheat/Grim/pull/2420.diff -o pr-2420.diff

      - name: Apply PR diff
        run: |
          git apply pr-2420.diff

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Grim
        run: ./gradlew build

      - name: Upload Bukkit jars
        uses: actions/upload-artifact@v4
        with:
          name: grim-bukkit-pr-2420
          path: |
            bukkit/build/libs/*.jar

      - name: Upload all jars (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: grim-all-jars-pr-2420
          path: |
            **/build/libs/*.jar
