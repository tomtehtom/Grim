name: Build Latest Grim

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest Grim
        uses: actions/checkout@v4
        with:
          repository: GrimAnticheat/Grim
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Grim
        run: ./gradlew build

      - name: Upload Bukkit jars
        uses: actions/upload-artifact@v4
        with:
          name: grim-bukkit-latest
          path: |
            bukkit/build/libs/*.jar
          if-no-files-found: warn

      - name: Upload all jars
        uses: actions/upload-artifact@v4
        with:
          name: grim-all-jars-latest
          path: |
            **/build/libs/*.jar
          if-no-files-found: warn
